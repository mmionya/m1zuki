name: Publish m1zuki 1.4.0
on:
  workflow_dispatch:
  push:
    branches: ['codex/release-1.4.0']
permissions:
  contents: read
concurrency:
  group: release-1.4.0
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install cmake ninja
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_mingw
          archives: qtbase qtsvg
          tools: 'tools_mingw1310,qt.tools.win64_mingw1310'
          cache: true
      - name: Build and test Windows package
        shell: pwsh
        run: ./build-windows.ps1 -QtRoot $env:QT_ROOT_DIR -MingwRoot "$env:IQTA_TOOLS/mingw1310_64" -OutputName m1zuki-windows-1.4.0
      - uses: actions/upload-artifact@v6
        with:
          name: m1zuki-windows-release
          path: dist/m1zuki-windows-1.4.0-x64.zip
          if-no-files-found: error
      - name: Test output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m1zuki-windows-verification
          path: build-windows/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
  publish:
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify artifacts and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/publish_release.py
