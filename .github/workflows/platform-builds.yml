name: Linux and macOS packages
on:
  workflow_dispatch:
  push:
    branches: ['codex/platform-builds-*']
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 30
    steps:
      - name: Dependencies
        run: pacman -Syu --noconfirm git cmake ninja qt6-base qt6-svg kglobalaccel kconfig layer-shell-qt spectacle ttf-dejavu dbus nodejs
      - uses: actions/checkout@v6
      - name: Build and test
        run: |
          bash -n run.sh install.sh build-linux.sh install-package.sh
          bash build-linux.sh
      - uses: actions/upload-artifact@v6
        with:
          name: m1zuki-linux-x86_64
          path: dist/m1zuki-linux-*.tar.gz
          if-no-files-found: error
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install build tools
        run: brew install cmake ninja
      - name: Install universal Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: mac
          target: desktop
          arch: clang_64
          cache: true
      - name: Build and test universal app
        env:
          M1ZUKI_MAC_ARCHS: 'arm64;x86_64'
        run: QT_ROOT="$QT_ROOT_DIR" bash build-macos.sh
      - uses: actions/upload-artifact@v6
        with:
          name: m1zuki-macos-universal
          path: |
            dist/m1zuki-macos-*.zip
            dist/MACOS.md
          if-no-files-found: error
